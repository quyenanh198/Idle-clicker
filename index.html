<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidegear</title>
<style>
:root{color-scheme:dark;
  --bg:#0f2a3d; --bg2:#173b55; --panel:#1f4c6b; --panel2:#2a6288; --ink:#f3f8fc; --muted:#a9c4d8;
  --gold:#ffc83d; --good:#3ddc84; --bad:#ff5a6a; --sel:#ffe27a; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--ink);
  font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:12px}
button:disabled{opacity:.45;cursor:not-allowed}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;flex-wrap:wrap}
.cur{background:rgba(0,0,0,.3);padding:4px 10px;border-radius:999px;font-size:14px}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
nav{display:flex;background:#0b1f2e;border-top:2px solid var(--panel2);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;padding:10px 4px;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav button .ic{font-size:24px}
nav button.on{background:var(--panel2);color:var(--ink)}
h2{margin:6px 0 10px;font-size:20px;text-align:center}
.panel{background:var(--panel);border-radius:var(--r);padding:8px 10px;margin-bottom:8px}

/* play */
.play{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.wavebar{text-align:center;font-size:14px}
.prog{height:10px;background:#0b1f2e;border-radius:6px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--gold)}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:8px;background:var(--bad);font-size:12px}
canvas#lane{display:block;width:100%;aspect-ratio:1000/400;border-radius:var(--r);background:#1d5876;touch-action:manipulation;cursor:crosshair}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border-radius:50%}
.slot::before{content:"⚙";position:absolute;font-size:clamp(22px,7vw,40px);color:rgba(0,0,0,.25);line-height:1}
.slot.ok::before{color:rgba(61,220,132,.55)}
.gear{position:relative;width:92%;height:92%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,5.5vw,30px);background:radial-gradient(circle,#8aa1b3 52%,#5c7486 54%);
  box-shadow:0 0 0 3px #3b5160 inset}
.gear.motor{background:radial-gradient(circle,#ffd65a 45%,#c99a17 47%);color:#6b4b00}
.gear.cog{background:radial-gradient(circle,#ffd65a 52%,#c99a17 54%);color:#5a3d00;font-weight:900}
.gear.on{box-shadow:0 0 0 3px var(--good) inset,0 0 10px rgba(61,220,132,.6)}
.gear.on.spin{animation:spin 3s linear infinite}
.gear.on.spin>.face{animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.slot.sel .gear{box-shadow:0 0 0 4px var(--sel) inset,0 0 14px var(--sel)}
.slot.can .gear{box-shadow:0 0 0 3px #fff inset}
.lv{position:absolute;top:-3px;left:-3px;background:#0b1f2e;font-size:10px;border-radius:8px;padding:0 4px}
.rate{position:absolute;bottom:-4px;font-size:9px;background:#0b1f2e;border-radius:6px;padding:0 3px;white-space:nowrap}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offer{background:var(--panel2);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.offer.picked{box-shadow:0 0 0 3px var(--sel)}
.offer .em{font-size:30px}
.offer small{color:var(--muted);font-size:11px}
.price{background:var(--gold);color:#3a2700;border-radius:8px;padding:1px 8px;font-size:13px}
.row{display:flex;gap:8px}
.btn{flex:1;padding:12px;font-size:17px}
.blue{background:#2f7fd0}.green{background:#22a85a}.red{background:#c43c4c}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}

/* upgrades / crew / summon */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:900px;margin:0 auto}
.card{background:var(--panel);border-radius:var(--r);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.card .em{font-size:44px}
.card.locked{filter:grayscale(1);opacity:.55}
.card small{color:var(--muted)}
.card button{width:100%;padding:8px;background:#2f7fd0;margin-top:auto}
.portal{width:200px;height:200px;margin:10px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:80px;
  background:radial-gradient(circle,#0b1f2e 35%,#3fb6ff 55%,#6a3fd0 75%,transparent 76%);animation:spin 6s linear infinite}
.summon{max-width:420px;margin:0 auto;text-align:center}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#0b1f2e;border:2px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.gear.on.spin,.gear.on.spin>.face,.portal{animation:none}}

/* desktop: side rail + two columns */
@media (min-width:900px){
  #app{flex-direction:row}
  nav{order:-1;flex-direction:column;width:96px;border-top:0;border-right:2px solid var(--panel2);padding:16px 0}
  nav button{flex:none;padding:16px 4px}
  .body{flex:1;display:flex;flex-direction:column;min-width:0}
  .play{max-width:1200px;display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
  .slot::before{font-size:44px}
  .gear{font-size:30px}
}
@media (max-width:899px){.body{display:contents}nav{order:2}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <div class="body">
    <header id="hdr"></header>
    <main id="main"></main>
  </div>
</div>
<script>
// ================= data =================
// Swap `em` for sprite image paths later; draw code goes through drawSprite().
const UNITS = {
  bot:   {name:'Rivet Bot',  em:'🤖', start:true, kind:'Melee',  hp:30, dmg:6,  cd:1.0, range:30,  speed:70, rate:0.50},
  crab:  {name:'Clamp Crab', em:'🦀', start:true, kind:'Tank',   hp:80, dmg:4,  cd:1.2, range:30,  speed:55, rate:0.35},
  owl:   {name:'Lamp Owl',   em:'🦉', kind:'Ranged', hp:18, dmg:7,  cd:1.2, range:170, speed:60, rate:0.40},
  jelly: {name:'Chill Jelly',em:'🪼', kind:'Ranged, slows', hp:22, dmg:3, cd:1.0, range:140, speed:55, rate:0.40, slow:true},
  fox:   {name:'Flare Fox',  em:'🦊', kind:'Melee, fast', hp:34, dmg:11, cd:0.7, range:30, speed:100, rate:0.40},
  drake: {name:'Storm Drake',em:'🐉', kind:'Ranged', hp:55, dmg:16, cd:1.5, range:200, speed:50, rate:0.25},
};
const COG = {name:'Lucky Cog'};           // the "+1" gear: +level gold per monster defeated
const MONSTERS = ['🐙','🦑','🐡','🦈','🐊'];
const BOSS = '🐋';
const SKILLS = {
  dmg:  {name:'Damage',      em:'⚔️', desc:l=>`+${l*10}% crew damage`},
  hp:   {name:'Crew HP',     em:'❤️', desc:l=>`+${l*10}% crew HP`},
  base: {name:'Lighthouse',  em:'🗼', desc:l=>`+${l*20}% base HP`},
  inc:  {name:'Income',      em:'💰', desc:l=>`+${l} Gold per wave`},
  tap:  {name:'Tap Power',   em:'👆', desc:l=>`+${l*100}% tap damage`},
  start:{name:'Start Gold',  em:'🏦', desc:l=>`+${l*10} Gold each stage`},
};
const COLS=6, ROWS=4, CELLS=COLS*ROWS, MAXLV=6, MOTORS=[7,9], SAVE='tidegear-save-v2';
const W=1000, H=400, BASE_L=60, BASE_R=940, GROUND=250;

// ================= state =================
let S = load() || fresh();
let tab='play', sel=-1, pick=-1, battle=null, toastT=0;

function fresh(){
  const cards={}; for (const k in UNITS) if (UNITS[k].start) cards[k]={lvl:1,copies:0};
  const s={gold:0,bolts:0,pearls:60,stage:1,wave:1,bought:0,board:[],offers:[],cards,
    skills:{dmg:0,hp:0,base:0,inc:0,tap:0,start:0},lastSeen:Date.now()};
  newStage(s); return s;
}
function newStage(s){
  s.wave=1; s.bought=0; s.gold=40+s.skills.start*10;
  s.board=Array(CELLS).fill(null); MOTORS.forEach(i=>s.board[i]={k:'motor'});
  rollOffers(s);
}
function rollOffers(s){
  const pool=[...Object.keys(s.cards),'cog'];
  s.offers=[0,1,2].map(()=>pool[Math.floor(Math.random()*pool.length)]);
}
function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE)); return s&&s.board?s:null; }catch(e){ return null; } }
function save(){ S.lastSeen=Date.now(); try{ localStorage.setItem(SAVE,JSON.stringify(S)); }catch(e){} }

// ================= board =================
const nbrs=i=>{ const r=Math.floor(i/COLS), c=i%COLS, out=[];
  if(r>0)out.push(i-COLS); if(r<ROWS-1)out.push(i+COLS); if(c>0)out.push(i-1); if(c<COLS-1)out.push(i+1); return out; };
function powered(){ // flood fill from drive gears through any placed gear
  const on=new Set(MOTORS), q=[...MOTORS];
  while(q.length){ const i=q.shift(); for(const n of nbrs(i)) if(S.board[n]&&!on.has(n)){ on.add(n); q.push(n); } }
  return on;
}
function canPlace(i){ const on=powered(); return !S.board[i] && nbrs(i).some(n=>on.has(n)); }

// ================= formulas (see DESIGN.md) =================
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toString();
const gw=()=>2*(S.stage-1)+S.wave;
const isHard=w=>w===5||w===10;
const price=()=>10+S.bought;
const cardMul=k=>1+0.15*(S.cards[k].lvl-1);
function unitStats(k,l){
  const u=UNITS[k], m=Math.pow(1.8,l-1)*cardMul(k);
  return {hp:u.hp*m*(1+0.1*S.skills.hp), dmg:u.dmg*m*(1+0.1*S.skills.dmg), cd:u.cd, range:u.range, speed:u.speed, em:u.em, slow:!!u.slow};
}
const spawnRate=(k,l)=>UNITS[k].rate*(1+0.05*(l-1));
const cogBonus=()=>{ const on=powered(); return S.board.reduce((a,c,i)=>a+(c&&c.k==='cog'&&on.has(i)?c.l:0),0); };
const killGold=()=>1+Math.floor(gw()/4)+cogBonus();
const waveBonus=()=>10+2*S.wave+S.skills.inc;
const tapDmg=()=>5*Math.pow(1.28,gw())*(1+S.skills.tap);
const skillCost=k=>5*(S.skills[k]+1);
function waveSpec(){
  const g=gw(), hard=isHard(S.wave)?1.5:1;
  return {count:S.wave===10?1:4+S.wave, hp:24*Math.pow(1.3,g)*hard, dmg:4*Math.pow(1.28,g)*hard,
    fort:150*Math.pow(1.3,g)*hard, base:200*Math.pow(1.22,g)*(1+0.2*S.skills.base), every:Math.max(0.8,2.2-S.wave*0.1)};
}

// ================= actions =================
function pickOffer(i){
  if(battle||!S.offers[i]||S.gold<price()) return;
  pick = pick===i?-1:i; sel=-1;
  if(pick>=0 && !S.board.some((_,j)=>canPlace(j))) { pick=-1; toast('No free slot next to the chain. Merge gears first!'); }
  render();
}
function tapSlot(i){
  if(battle) return;
  const c=S.board[i];
  if(pick>=0){ // placing a bought gear
    if(!canPlace(i)) return toast('Place it next to a powered gear.');
    const k=S.offers[pick]; S.gold-=price(); S.bought++;
    S.board[i]={k,l:1}; S.offers[pick]=null; pick=-1;
    if(S.offers.every(o=>!o)) rollOffers(S);
    save(); render(); return;
  }
  if(sel<0){ if(c&&c.k!=='motor') sel=i; render(); return; }
  if(sel===i){ sel=-1; render(); return; }
  const a=S.board[sel];
  if(!c){ S.board[i]=a; S.board[sel]=null; sel=-1; }
  else if(c.k===a.k && c.l===a.l && c.l<MAXLV){ S.board[i]={k:c.k,l:c.l+1}; S.board[sel]=null; sel=-1; }
  else sel = c.k==='motor'?-1:i;
  save(); render();
}
function reroll(){ if(battle||S.gold<5) return; S.gold-=5; pick=-1; rollOffers(S); save(); render(); }

// ================= battle =================
function fight(){
  if(battle) return;
  const on=powered();
  const spawners=S.board.map((c,i)=>c&&UNITS[c.k]&&on.has(i)?{k:c.k,l:c.l,t:0}:null).filter(Boolean);
  if(!spawners.length) return toast('Connect a crew gear to the chain first!');
  const w=waveSpec();
  battle={w,spawners,left:w.count,et:0,units:[],fx:[],base:w.base,baseMax:w.base,fort:w.fort,fortMax:w.fort,gold:0,kg:killGold()};
  sel=-1; pick=-1; render();
}
function mkEnemy(w){
  const boss=S.wave===10, y=GROUND+(Math.random()*60-30);
  const m=boss?6:1;
  return {side:1,x:BASE_R-30,y,hp:w.hp*m,max:w.hp*m,dmg:w.dmg*(boss?2:1),cd:1.1,t:0,range:30,speed:45,em:boss?BOSS:MONSTERS[Math.floor(Math.random()*MONSTERS.length)],size:boss?64:34,slowT:0};
}
function tick(dt){
  const b=battle; if(!b) return;
  for(const s of b.spawners){ s.t+=dt; const per=1/spawnRate(s.k,s.l); while(s.t>=per){ s.t-=per;
    const st=unitStats(s.k,s.l); b.units.push({side:0,x:BASE_L+30,y:GROUND+(Math.random()*60-30),max:st.hp,t:0,size:30,slowT:0,...st}); } }
  b.et+=dt; if(b.left>0 && b.et>=b.w.every){ b.et=0; b.left--; b.units.push(mkEnemy(b.w)); }
  for(const u of b.units){
    if(u.hp<=0) continue;
    u.t-=dt*(u.slowT>0?0.5:1); u.slowT-=dt;
    const dir=u.side?-1:1; let tgt=null, best=1e9;
    for(const o of b.units){ if(o.side===u.side||o.hp<=0) continue; const d=(o.x-u.x)*dir; if(d>=-10 && d<best){best=d;tgt=o;} }
    const baseX=u.side?BASE_L:BASE_R, baseD=(baseX-u.x)*dir;
    if(tgt && best<=u.range){ if(u.t<=0){ u.t=u.cd; hit(tgt,u.dmg,u); } }
    else if(baseD<=u.range+20){ if(u.t<=0){ u.t=u.cd; if(u.side){ b.base-=u.dmg; } else { b.fort-=u.dmg; } fx(baseX,u.y-30,'-'+fmt(u.dmg),u.side?'#ff8a8a':'#fff'); } }
    else u.x+=dir*u.speed*dt*(u.slowT>0?0.5:1);
  }
  b.units=b.units.filter(u=>u.hp>0);
  b.fx=b.fx.filter(f=>(f.t-=dt)>0);
  if(b.fort<=0) return endWave(true);
  if(b.base<=0) return endWave(false);
}
function hit(t,d,src){
  if(t.hp<=0) return;
  t.hp-=d; if(src&&src.slow) t.slowT=1.5;
  if(t.hp<=0 && t.side===1){ const g=battle.kg; battle.gold+=g; S.gold+=g; fx(t.x,t.y-30,'+'+g+'🪙','#ffc83d'); }
}
function fx(x,y,txt,col){ battle.fx.push({x,y,txt,col,t:0.7}); }
function tapLane(ev){
  if(!battle) return;
  const r=ev.currentTarget.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width*W, y=(ev.clientY-r.top)/r.height*H;
  let tgt=null,best=80;
  for(const u of battle.units) if(u.side===1){ const d=Math.hypot(u.x-x,u.y-y); if(d<best){best=d;tgt=u;} }
  const d=tapDmg();
  if(tgt){ fx(tgt.x,tgt.y-40,'-'+fmt(d),'#ffe27a'); hit(tgt,d); }
  else if(x>BASE_R-80){ battle.fort-=d; fx(BASE_R,GROUND-90,'-'+fmt(d),'#ffe27a'); }
}
function endWave(won){
  const earned=battle.gold; battle=null;
  if(!won){ toast(`The lighthouse fell! You kept ${earned} 🪙 from kills. Strengthen your chain and retry.`); save(); render(); return; }
  const g=waveBonus(); S.gold+=g;
  if(S.wave===10){
    const bo=5*S.stage; S.bolts+=bo; S.pearls+=10;
    toast(`Stage ${S.stage} cleared! +${bo} 🔩 +10 🫧`); S.stage++; newStage(S);
  } else { S.wave++; rollOffers(S); toast(`Wave won! +${g} 🪙 bonus`); }
  save(); render();
}

// ================= meta =================
function buySkill(k){ const c=skillCost(k); if(S.bolts<c) return; S.bolts-=c; S.skills[k]++; save(); render(); }
function summon(){
  if(S.pearls<30) return; S.pearls-=30;
  const keys=Object.keys(UNITS), k=keys[Math.floor(Math.random()*keys.length)];
  if(!S.cards[k]){ S.cards[k]={lvl:1,copies:0}; toast(`New crew: ${UNITS[k].em} ${UNITS[k].name}!`); }
  else { S.cards[k].copies++; toast(`${UNITS[k].em} ${UNITS[k].name} copy +1`); }
  save(); render();
}
function upCard(k){ const c=S.cards[k]; if(c.copies<c.lvl*2) return; c.copies-=c.lvl*2; c.lvl++; save(); render(); }

// ================= drawing =================
function drawSprite(ctx,em,x,y,size,flip){
  ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);
  ctx.font=`${size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(em,0,0); ctx.restore();
}
function bar(ctx,x,y,w,f,col){ ctx.fillStyle='#0b1f2e'; ctx.fillRect(x-w/2,y,w,7); ctx.fillStyle=col; ctx.fillRect(x-w/2,y,w*Math.max(0,f),7); }
function drawLane(){
  const cv=document.getElementById('lane'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#3d6c8c'); sky.addColorStop(.45,'#5b8fae'); sky.addColorStop(.46,'#c9b27a'); sky.addColorStop(1,'#a88d55');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  const b=battle;
  drawSprite(ctx,'🗼',BASE_L,GROUND-40,110); drawSprite(ctx,'🏯',BASE_R,GROUND-40,110);
  bar(ctx,BASE_L,GROUND+40,90,b?b.base/b.baseMax:1,'#3ddc84');
  bar(ctx,BASE_R,GROUND+40,90,b?b.fort/b.fortMax:1,'#ff5a6a');
  if(!b){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,H-60,W,60); ctx.fillStyle='#fff'; ctx.font='bold 28px system-ui'; ctx.textAlign='center';
    ctx.fillText('Build your gear chain, then press FIGHT!',W/2,H-22); return; }
  ctx.fillStyle='#fff'; ctx.font='bold 26px system-ui'; ctx.textAlign='right'; ctx.fillText(`👾 ${b.left} incoming`,W-20,34);
  ctx.textAlign='left'; ctx.fillText(`+${b.gold} 🪙`,20,34);
  [...b.units].sort((a,c)=>a.y-c.y).forEach(u=>{ drawSprite(ctx,u.em,u.x,u.y,u.size*1.6,u.side===0);
    bar(ctx,u.x,u.y-u.size,u.size*1.4,u.hp/u.max,u.side?'#ff5a6a':'#3ddc84');
    if(u.slowT>0){ ctx.font='18px serif'; ctx.fillText('❄️',u.x+12,u.y-u.size-10); } });
  ctx.textAlign='center'; ctx.font='bold 26px system-ui';
  b.fx.forEach(f=>{ ctx.globalAlpha=Math.min(1,f.t/0.4); ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y-(0.7-f.t)*60); }); ctx.globalAlpha=1;
}

// ================= ui =================
const $=id=>document.getElementById(id);
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2400);
}
function go(k){ tab=k; sel=-1; pick=-1; render(); }
function renderNav(){
  const tabs=[['up','🛠️','Upgrades'],['play','⚓','Play'],['crew','🃏','Crew'],['summon','🌀','Summon']];
  $('nav').innerHTML=tabs.map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}</button>`).join('');
}
function renderHdr(){ $('hdr').innerHTML=`<span class="cur">🪙 ${fmt(S.gold)}</span><span class="cur">🔩 ${fmt(S.bolts)}</span><span class="cur">🫧 ${fmt(S.pearls)}</span>`; }
const pieceName=k=>k==='cog'?COG.name:UNITS[k].name;
function gearHTML(c,on){
  if(c.k==='motor') return `<div class="gear motor ${on?'on spin':''}"><span class="face">⚙</span></div>`;
  if(c.k==='cog') return `<div class="gear cog ${on?'on spin':''}"><span class="face">+${c.l}</span></div>`;
  return `<div class="gear ${on?'on spin':''}"><span class="face">${UNITS[c.k].em}</span><span class="lv">${c.l}</span>${on?`<span class="rate">${spawnRate(c.k,c.l).toFixed(2)}/s</span>`:''}</div>`;
}
function renderPlay(){
  const on=powered(), a=sel>=0?S.board[sel]:null;
  const slots=S.board.map((c,i)=>{
    const can=a&&c&&i!==sel&&c.k===a.k&&c.l===a.l&&c.l<MAXLV;
    const ok=pick>=0&&canPlace(i);
    return `<div class="slot ${i===sel?'sel':''} ${can?'can':''} ${ok?'ok':''}" onclick="tapSlot(${i})">${c?gearHTML(c,on.has(i)):''}</div>`;
  }).join('');
  const offers=S.offers.map((k,i)=>k?`<button class="offer ${pick===i?'picked':''}" onclick="pickOffer(${i})" ${battle||S.gold<price()?'disabled':''}>
      <span class="em">${k==='cog'?'⚙️':UNITS[k].em}</span><small>${pieceName(k)}</small><span class="price">🪙 ${price()}</span></button>`
      :`<div class="offer" style="opacity:.3"><span class="em">✓</span><small>Sold</small></div>`).join('');
  const hint = pick>=0 ? 'Tap a green slot next to the chain to place it.'
    : 'Only gears linked to a drive gear work. Tap two matching gears to merge.';
  return `<div class="play">
    <div>
      <div class="panel wavebar">Stage ${S.stage} · Wave ${S.wave}/10
        <div class="prog"><i style="width:${(S.wave-1)*10}%"></i></div>
        ${S.wave===10?'<span class="tag">🐋 BOSS</span>':isHard(S.wave)?'<span class="tag">🔥 HARD WAVE</span>':''}</div>
      <canvas id="lane" width="${W}" height="${H}" onpointerdown="tapLane(event)"></canvas>
      <p class="hint" style="margin-bottom:10px">Tap monsters to hit them for ${fmt(tapDmg())}. Each kill pays ${killGold()} 🪙, wave bonus ${waveBonus()} 🪙.</p>
    </div>
    <div>
      <div class="panel"><div class="board">${slots}</div><p class="hint">${hint}</p></div>
      <div class="panel"><div class="shop">${offers}</div></div>
      <div class="row">
        <button class="btn blue" onclick="reroll()" ${battle||S.gold<5?'disabled':''}>🔄 Reroll 🪙5</button>
        <button class="btn ${isHard(S.wave)?'red':'green'}" onclick="fight()" ${battle?'disabled':''}>${battle?'Fighting…':'FIGHT!'}</button>
      </div>
    </div></div>`;
}
function renderUp(){
  return `<h2>Upgrades</h2><div class="list">${Object.entries(SKILLS).map(([k,s])=>`
    <div class="card"><span class="em">${s.em}</span><b>${s.name}</b><small>Lv ${S.skills[k]} · ${s.desc(S.skills[k])}</small>
    <button onclick="buySkill('${k}')" ${S.bolts<skillCost(k)?'disabled':''}>Upgrade 🔩 ${skillCost(k)}</button></div>`).join('')}</div>
    <p class="hint" style="margin-top:12px">Earn 🔩 Bolts by clearing stages and while you are away.</p>`;
}
function renderCrew(){
  return `<h2>Crew</h2><div class="list">${Object.entries(UNITS).map(([k,u])=>{
    const c=S.cards[k];
    if(!c) return `<div class="card locked"><span class="em">${u.em}</span><b>${u.name}</b><small>Find in Summon</small></div>`;
    const need=c.lvl*2, m=cardMul(k);
    return `<div class="card"><span class="em">${u.em}</span><b>${u.name}</b>
      <small>${u.kind} · Card Lv ${c.lvl}<br>HP ${Math.round(u.hp*m)} · DMG ${(u.dmg*m).toFixed(1)} · ${u.rate}/s</small>
      <button onclick="upCard('${k}')" ${c.copies<need?'disabled':''}>Level up (${c.copies}/${need})</button></div>`;
  }).join('')}</div>`;
}
function renderSummon(){
  return `<div class="summon"><h2>Tide Portal</h2><div class="portal">🌀</div>
    <p>Unlock new crew gears or collect copies to level them up.</p>
    <button class="btn blue" style="width:100%" onclick="summon()" ${S.pearls<30?'disabled':''}>Summon ×1 · 🫧 30</button>
    <p class="hint">Every crew type has equal odds. 🫧 Pearls come from clearing stages.</p></div>`;
}
function render(){
  renderNav(); renderHdr();
  $('main').innerHTML=tab==='play'?renderPlay():tab==='up'?renderUp():tab==='crew'?renderCrew():renderSummon();
  drawLane();
}

// ================= idle reward + loop =================
const away=Math.min(480,(Date.now()-S.lastSeen)/60000), awayBolts=Math.floor(away/10)*S.stage;
if(awayBolts>0){ S.bolts+=awayBolts; setTimeout(()=>toast(`Welcome back! Your crew earned ${awayBolts} 🔩 while you were away.`),300); }
save();
let last=performance.now(), hdrT=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(battle){ tick(dt); drawLane(); if((hdrT+=dt)>0.25){ hdrT=0; renderHdr(); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(save,15000);
render();
</script>
</body>
</html>
